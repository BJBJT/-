name: build
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ModelHubAndroid.zip
      - run: printf 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx3g\n' > ModelHubAndroid/gradle.properties
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.13 }
      - run: gradle assembleDebug
        working-directory: ModelHubAndroid
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ModelHubAndroid/app/build/outputs/apk/debug/app-debug.apk
